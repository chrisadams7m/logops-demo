<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGOPS — Démonstrateur</title><style>:root{font-family:system-ui,Arial;background:#f2f5f8;color:#15283b}body{margin:0}header{background:#18324b;color:white;padding:18px 20px}header small{color:#c9d8e7}main{max-width:850px;margin:auto;padding:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer;background:#dce5ed;color:#18324b;font-weight:650}.tabs button.active,button.primary{background:#176a79;color:white}.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px #10203012;margin:12px 0}label{display:block;font-weight:600;margin:12px 0 5px}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #b6c4d0;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted{color:#607385;font-size:.9rem}.notice{background:#fff3d9;padding:10px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:9px;text-align:left;border-bottom:1px solid #dce5ed}th{background:#eef3f7}#message{min-height:24px;color:#176a79;font-weight:600}@media(max-width:520px){.grid{grid-template-columns:1fr}table{font-size:.78rem}th,td{padding:5px}}</style></head><body><header><strong>LOGOPS <small> / démonstrateur TC1 → GTIA</small></strong><div style="font-size:.8rem;margin-top:5px">EXERCICE FICTIF — aucune donnée opérationnelle</div></header><main><div class="notice">Prototype local : les données restent dans ce navigateur. Aucun serveur ni partage multi-utilisateur.</div><div class="tabs"><button data-tab="situation" class="active">SITLOG</button><button data-tab="demandes">LOGREQ</button><button data-tab="flux">FLUX</button><button data-tab="synthese">Synthèse GTIA</button></div><div id="content"></div><p id="message" role="status"></p><button id="export">Exporter les données (JSON)</button> <button id="reset">Réinitialiser la simulation</button></main><script>
const KEY='logops-demo-v1';const seed={units:[{id:'UE Alpha',gtia:'GTIA 1',effectifs:115,materiel:82,vivres:4,carburant:2.5,munitions:1.8},{id:'UE Bravo',gtia:'GTIA 1',effectifs:103,materiel:76,vivres:3,carburant:1.5,munitions:2.2},{id:'UE Charlie',gtia:'GTIA 1',effectifs:97,materiel:91,vivres:5,carburant:3,munitions:2.8}],requests:[],flows:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}let tab='situation';const el=document.getElementById('content');const msg=t=>document.getElementById('message').textContent=t;function save(){localStorage.setItem(KEY,JSON.stringify(db))}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function unitOptions(){return db.units.map(u=>`<option>${esc(u.id)}</option>`).join('')}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='situation')el.innerHTML=`<section class="panel"><h2>Situation du TC1</h2><form id="sit"><label>Unité</label><select name="unit" id="unit">${unitOptions()}</select><div class="grid">${[['effectifs','Effectifs disponibles (personnes)'],['materiel','Potentiel matériel (%)'],['vivres','Vivres (jours)'],['carburant','Carburant (jours)'],['munitions','Munitions (DOS)']].map(([k,l])=>`<div><label>${l}</label><input name="${k}" type="number" min="0" step="${k==='effectifs'?'1':'0.1'}" required></div>`).join('')}</div><p class="muted">Les valeurs sont fictives et modifiables.</p><button class="primary">Enregistrer la situation</button></form></section>`;else if(tab==='demandes')el.innerHTML=`<section class="panel"><h2>Nouvelle demande de recomplètement</h2><form id="req"><label>Unité</label><select name="unit">${unitOptions()}</select><label>Ressource</label><select name="type"><option>Vivres</option><option>Carburant</option><option>Munitions</option><option>Pièces de rechange</option></select><label>Quantité et unité</label><input name="quantity" maxlength="80" placeholder="Ex. 500 litres" required><label>Échéance souhaitée (texte libre)</label><input name="deadline" maxlength="80" placeholder="Ex. demain matin"><button class="primary" style="margin-top:16px">Créer la demande</button></form></section>`;else if(tab==='flux')el.innerHTML=`<section class="panel"><h2>Suivi des demandes et des flux</h2><p class="muted">Le GTIA peut faire évoluer le statut de chaque demande fictive.</p>${db.requests.length?`<div style="overflow-x:auto"><table><tr><th>Unité</th><th>Ressource</th><th>Quantité</th><th>Statut</th></tr>${db.requests.map(r=>`<tr><td>${esc(r.unit)}</td><td>${esc(r.type)}</td><td>${esc(r.quantity)}</td><td><select data-status="${r.id}">${['Demandé','Validé','Alloué','Expédié','En transit','Livré','Réceptionné'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<p>Aucune demande pour le moment.</p>'}</section>`;else el.innerHTML=`<section class="panel"><h2>RLP simplifiée — GTIA 1</h2><p class="muted">Situation consolidée à partir des trois unités fictives.</p><div style="overflow-x:auto"><table><tr><th>Unité</th><th>Effectifs</th><th>Matériel</th><th>Vivres</th><th>Carburant</th><th>Munitions</th></tr>${db.units.map(u=>`<tr><td>${esc(u.id)}</td><td>${u.effectifs}</td><td>${u.materiel}%</td><td>${u.vivres} j</td><td>${u.carburant} j</td><td>${u.munitions} DOS</td></tr>`).join('')}</table></div><p><strong>Effectifs disponibles :</strong> ${db.units.reduce((a,u)=>a+Number(u.effectifs),0)}</p><p><strong>Demandes ouvertes :</strong> ${db.requests.filter(r=>r.status!=='Réceptionné').length}</p><p class="muted">Les autonomies ne sont pas additionnées ni moyennées : une agrégation pertinente exige les consommations et les dotations de référence.</p></section>`;if(tab==='situation'){const form=document.getElementById('sit');function fill(){let u=db.units.find(u=>u.id===form.unit.value);for(let k of ['effectifs','materiel','vivres','carburant','munitions'])form[k].value=u[k]}document.getElementById('unit').addEventListener('change',fill);fill();form.onsubmit=e=>{e.preventDefault();let u=db.units.find(u=>u.id===form.unit.value);for(let k of ['effectifs','materiel','vivres','carburant','munitions'])u[k]=Number(form[k].value);save();msg('Situation enregistrée localement.')}}if(tab==='demandes')document.getElementById('req').onsubmit=e=>{e.preventDefault();let f=e.target;db.requests.push({id:Date.now()+'-'+Math.random(),unit:f.unit.value,type:f.type.value,quantity:f.quantity.value,deadline:f.deadline.value,status:'Demandé'});save();msg('Demande enregistrée localement.');f.reset()};if(tab==='flux')document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{let r=db.requests.find(r=>String(r.id)===s.dataset.status);if(r){r.status=s.value;save();msg('Statut mis à jour localement.')}})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;msg('');render()});document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logops-simulation.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('reset').onclick=()=>{if(confirm('Effacer les données locales et restaurer la simulation ?')){db=structuredClone(seed);save();render();msg('Simulation réinitialisée.')}};render();</script></body></html>
